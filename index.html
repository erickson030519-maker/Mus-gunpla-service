        const formatMYR = (amount) => {
            return `RM ${Number(amount).toLocaleString('en-MY', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
        };

        const getTodayString = () => {
            const today = new Date();
            return today.toISOString().split('T')[0];
        };

        const getTomorrowString = () => {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return tomorrow.toISOString().split('T')[0];
        };

        const calculateNights = (checkIn, checkOut) => {
            if (!checkIn || !checkOut) return 1;
            const start = new Date(checkIn);
            const end = new Date(checkOut);
            const diffTime = end - start;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 0 ? diffDays : 1;
        };

        function App() {
            // State declarations
            const [homestays, setHomestays] = React.useState(INITIAL_HOMESTAYS);
            const [selectedHomestay, setSelectedHomestay] = React.useState(null);
            const [wishlist, setWishlist] = React.useState([]);
            const [activeTab, setActiveTab] = React.useState('explore'); // 'explore', 'bookings', 'host', 'saved'
            
            // Search & Filter state
            const [searchKeyword, setSearchKeyword] = React.useState('');
            const [selectedLocation, setSelectedLocation] = React.useState('All');
            const [selectedCategory, setSelectedCategory] = React.useState('All');
            const [maxPrice, setMaxPrice] = React.useState(500);
            const [minBedrooms, setMinBedrooms] = React.useState(1);

            // Booking Form Modal State
            const [bookingModalOpen, setBookingModalOpen] = React.useState(false);
            const [checkInDate, setCheckInDate] = React.useState(getTodayString());
            const [checkOutDate, setCheckOutDate] = React.useState(getTomorrowString());
            const [guestsCount, setGuestsCount] = React.useState(2);
            
            // Guest Details state
            const [guestName, setGuestName] = React.useState('');
            const [guestEmail, setGuestEmail] = React.useState('');
            const [guestPhone, setGuestPhone] = React.useState('');
            const [specialRequests, setSpecialRequests] = React.useState('');
            const [pdpaAccepted, setPdpaAccepted] = React.useState(true);
            const [formErrors, setFormErrors] = React.useState({});

            // Bookings History state
            const [userBookings, setUserBookings] = React.useState([]);
            const [activeReceipt, setActiveReceipt] = React.useState(null);

            // Map overlay view toggle
            const [showMapView, setShowMapView] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);

            // Helper to show temporary toast notification
            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Wishlist toggle
            const toggleWishlist = (e, id) => {
                e.stopPropagation();
                if (wishlist.includes(id)) {
                    setWishlist(wishlist.filter(item => item !== id));
                    triggerToast("Removed stay from your saved list");
                } else {
                    setWishlist([...wishlist, id]);
                    triggerToast("Saved to your Borneo wishlist!");
                }
            };

            // Filter computation
            const filteredHomestays = homestays.filter(item => {
                const matchesKeyword = item.title.toLowerCase().includes(searchKeyword.toLowerCase()) || 
                                       item.location.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                                       item.description.toLowerCase().includes(searchKeyword.toLowerCase());
                const matchesLocation = selectedLocation === 'All' || item.location === selectedLocation;
                const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                const matchesPrice = item.nightly_price_myr <= maxPrice;
                const matchesBedrooms = item.bedrooms >= minBedrooms;

                return matchesKeyword && matchesLocation && matchesCategory && matchesPrice && matchesBedrooms;
            });

            // Clean date change handling with validation
            const handleCheckInChange = (e) => {
                const newCheckIn = e.target.value;
                setCheckInDate(newCheckIn);
                if (new Date(checkOutDate) <= new Date(newCheckIn)) {
                    const nextDay = new Date(newCheckIn);
                    nextDay.setDate(nextDay.getDate() + 1);
                    setCheckOutDate(nextDay.toISOString().split('T')[0]);
                }
            };

            const handleCheckOutChange = (e) => {
                const newCheckOut = e.target.value;
                if (new Date(newCheckOut) <= new Date(checkInDate)) {
                    triggerToast("Check-out date must be after check-in date!");
                    return;
                }
                setCheckOutDate(newCheckOut);
            };

            // Dynamic stay total cost calculation
            const stayNights = calculateNights(checkInDate, checkOutDate);
            const currentPricePerNight = selectedHomestay ? selectedHomestay.nightly_price_myr : 0;
            const subtotalPrice = currentPricePerNight * stayNights;
            const cleaningFee = selectedHomestay ? 45 : 0;
            const serviceTax = selectedHomestay ? Math.round(subtotalPrice * 0.06) : 0;
            const grandTotalMYR = subtotalPrice + cleaningFee + serviceTax;

            // Handle Booking Submit
            const handleBookingSubmit = (e) => {
                e.preventDefault();
                const errors = {};

                if (!guestName.trim()) errors.name = "Full name is required";
                if (!guestEmail.trim() || !guestEmail.includes('@')) errors.email = "Valid email address is required";
                if (!guestPhone.trim() || guestPhone.length < 8) errors.phone = "Valid Malaysian phone number is required";
                if (!pdpaAccepted) errors.pdpa = "You must agree to PDPA privacy terms";

                if (Object.keys(errors).length > 0) {
                    setFormErrors(errors);
                    return;
                }

                setFormErrors({});

                const bookingRecord = {
                    bookingId: `BN-KCH-${Math.floor(10000 + Math.random() * 90000)}`,
                    homestay: selectedHomestay,
                    checkIn: checkInDate,
                    checkOut: checkOutDate,
                    nights: stayNights,
                    guests: guestsCount,
                    guestName,
                    guestEmail,
                    guestPhone,
                    specialRequests,
                    totalMYR: grandTotalMYR,
                    status: "Confirmed",
                    createdAt: new Date().toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' })
                };

                setUserBookings([bookingRecord, ...userBookings]);
                setBookingModalOpen(false);
                setActiveReceipt(bookingRecord);
                triggerToast("Booking request submitted successfully!");
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Toast Alert Banner */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-gray-700 animate-fade-in">

                        </div>
                    )}

                    {/* Top Navbar */}
                    <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            {/* Logo */}
                            <div 
                                onClick={() => { setSelectedHomestay(null); setActiveTab('explore'); setActiveReceipt(null); }}
                                className="flex items-center space-x-3 cursor-pointer group"
                            >
                                <div className="w-11 h-11 bg-teal-700 rounded-2xl flex items-center justify-center text-sarawak-yellow font-extrabold shadow-md transform group-hover:scale-105 transition">
                                    <i className="fa-solid fa-feather-pointed text-xl text-yellow-300"></i>
                                </div>
                                <div>
                                    <span className="text-2xl font-extrabold tracking-tight text-gray-900">Borneo<span className="text-teal-700">Nest</span></span>
                                    <span className="block text-[10px] uppercase font-bold tracking-widest text-emerald-700 -mt-1">Kuching, Sarawak</span>
                                </div>
                            </div>

                            {/* Center Navigation Links */}
                            <nav className="hidden md:flex items-center space-x-1 bg-gray-100/80 p-1.5 rounded-full border border-gray-200">
                                <button 
                                    onClick={() => { setActiveTab('explore'); setSelectedHomestay(null); setActiveReceipt(null); }}
                                    className={`px-5 py-2 text-sm font-semibold rounded-full transition ${activeTab === 'explore' && !selectedHomestay ? 'bg-white text-teal-800 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-compass mr-2 text-teal-600"></i>Explore Stays
                                </button>
                                <button 
                                    onClick={() => { setActiveTab('saved'); setSelectedHomestay(null); setActiveReceipt(null); }}
                                    className={`px-5 py-2 text-sm font-semibold rounded-full transition ${activeTab === 'saved' ? 'bg-white text-teal-800 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-heart mr-2 text-red-500"></i>Wishlist ({wishlist.length})
                                </button>
                                <button 
                                    onClick={() => { setActiveTab('bookings'); setSelectedHomestay(null); setActiveReceipt(null); }}
                                    className={`px-5 py-2 text-sm font-semibold rounded-full transition ${activeTab === 'bookings' ? 'bg-white text-teal-800 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-receipt mr-2 text-indigo-600"></i>My Bookings {userBookings.length > 0 && `(${userBookings.length})`}
                                </button>
                                <button 
                                    onClick={() => { setActiveTab('host'); setSelectedHomestay(null); setActiveReceipt(null); }}
                                    className={`px-5 py-2 text-sm font-semibold rounded-full transition ${activeTab === 'host' ? 'bg-white text-teal-800 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-house-user mr-2 text-amber-600"></i>Host Portal
                                </button>
                            </nav>

                            {/* Right Actions & MYR Currency Indicator */}
                            <div className="flex items-center space-x-3">
                                <div className="hidden sm:flex items-center space-x-2 bg-amber-50 border border-amber-200/80 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-800">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span>Prices in MYR (RM)</span>
                                </div>
                                <button 
                                    onClick={() => setShowMapView(!showMapView)}
                                    className="px-4 py-2 bg-teal-800 text-white rounded-xl text-sm font-bold shadow-md hover:bg-teal-900 transition flex items-center space-x-2"
                                >
                                    <i className={`fa-solid ${showMapView ? 'fa-list-ul' : 'fa-map-location-dot'}`}></i>
                                    <span className="hidden sm:inline">{showMapView ? 'Grid View' : 'Map View'}</span>
                                </button>

                                    <h3 className="font-bold text-gray-900 text-sm">{receipt.homestay.title}</h3>
                                    <p className="text-xs text-gray-500 mt-1"><i className="fa-solid fa-location-dot text-teal-700 mr-1"></i>{receipt.homestay.address}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 text-xs">
                                <div className="bg-gray-50 p-3 rounded-xl">
                                    <span className="text-gray-400 block text-[10px] font-bold">GUEST NAME</span>
                                    <span className="font-bold text-gray-800">{receipt.guestName}</span>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-xl">
                                    <span className="text-gray-400 block text-[10px] font-bold">CONTACT PHONE</span>
                                    <span className="font-bold text-gray-800">+60 {receipt.guestPhone}</span>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-xl">
                                    <span className="text-gray-400 block text-[10px] font-bold">CHECK-IN</span>
                                    <span className="font-bold text-gray-800">{receipt.checkIn}</span>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-xl">
                                    <span className="text-gray-400 block text-[10px] font-bold">CHECK-OUT</span>
                                    <span className="font-bold text-gray-800">{receipt.checkOut} ({receipt.nights} nights)</span>
                                </div>
                            </div>

                            {/* Total Cost Summary */}
                            <div className="bg-amber-50 p-4 rounded-xl border border-amber-200/80 flex items-center justify-between">
                                <div>
                                    <span className="text-xs text-gray-600 block">Total MYR Paid / Reserved</span>
                                    <span className="text-2xl font-extrabold text-teal-900">{formatMYR(receipt.totalMYR)}</span>
                                </div>
                                <span className="text-xs bg-emerald-600 text-white font-bold px-3 py-1 rounded-full">
                                    Guaranteed Rate
                                </span>
                            </div>

                            <div className="text-center pt-2 space-y-3">
                                <button 
                                    onClick={() => window.print()}
                                    className="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs rounded-xl transition flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-print"></i>
                                    <span>Print Receipt PDF</span>
                                </button>
                                <button 
                                    onClick={onBackToExplore}
                                    className="w-full py-3 bg-teal-800 hover:bg-teal-900 text-white font-bold text-xs rounded-xl shadow-md transition"
                                >
                                    Back to BorneoNest Main Page
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function HostPortalView({ homestays, setHomestays, userBookings, triggerToast }) {
            const [showAddForm, setShowAddForm] = React.useState(false);
            const [newTitle, setNewTitle] = React.useState('');
            const [newLocation, setNewLocation] = React.useState('Kuching City Centre');
            const [newPrice, setNewPrice] = React.useState(180);
            const [newBedrooms, setNewBedrooms] = React.useState(2);
            const [newCategory, setNewCategory] = React.useState('Heritage');
            const [newDescription, setNewDescription] = React.useState('');

            const handleCreateStay = (e) => {
                e.preventDefault();
                if (!newTitle.trim()) {
                    alert("Please provide a title for your homestay.");
                    return;
                }

                const createdStay = {
                    id: `hs_custom_${Date.now()}`,
                    title: newTitle,
                    location: newLocation,
                    address: `${newLocation}, Kuching, Sarawak`,
                    category: newCategory,
                    nightly_price_myr: Number(newPrice),
                    bedrooms: Number(newBedrooms),
                    beds: Number(newBedrooms),
                    bathrooms: 1,
                    max_guests: Number(newBedrooms) * 2,
                    rating: 5.0,
                    reviews_count: 1,
                    image_url: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80",
                    images: ["https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80"],
                    amenities: ["Free WiFi", "Air Conditioning", "Free Parking", "Kitchen"],
                    host_name: "Your Property",
                    host_avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80",
                    is_superhost: true,
                    description: newDescription || "Welcome to my newly listed homestay in Kuching! Clean, comfortable and near top attractions.",
                    nearby_landmarks: [{ name: "Kuching Center", distance: "5 mins" }],
                    coordinates: { lat: 1.55, lng: 110.34 }
                };

                setHomestays([createdStay, ...homestays]);
                setShowAddForm(false);
                setNewTitle('');
                setNewDescription('');
                triggerToast("New homestay successfully listed on BorneoNest!");
            };

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 animate-fade-in space-y-8">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-gray-200 pb-6">
                        <div>
                            <span className="text-xs font-bold uppercase tracking-wider text-amber-600">Kuching Property Management</span>
                            <h1 className="text-3xl font-extrabold text-gray-900">Host Dashboard</h1>
                            <p className="text-xs text-gray-500 mt-1">Manage listings and view incoming guest requests</p>
                        </div>
                        <button 
                            onClick={() => setShowAddForm(!showAddForm)}
                            className="px-5 py-2.5 bg-teal-800 hover:bg-teal-900 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center space-x-2"
                        >
                            <i className="fa-solid fa-plus"></i>
                            <span>{showAddForm ? 'Close Form' : 'Add New Listing'}</span>
                        </button>
                    </div>

                    {/* Add Homestay Form Modal / Collapsible */}
                    {showAddForm && (
                        <div className="bg-white p-6 rounded-3xl border border-teal-200 shadow-xl space-y-4">
                            <h3 className="font-extrabold text-gray-900 text-base border-b pb-3">List a New Kuching Homestay</h3>
                            <form onSubmit={handleCreateStay} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Homestay Title</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. Modern Riverfront Studio @ Carpenter Street" 
                                        value={newTitle}
                                        onChange={(e) => setNewTitle(e.target.value)}
                                        className="w-full px-4 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-teal-600"
                                        required
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Area / Location</label>
                                        <select 
                                            value={newLocation} 
                                            onChange={(e) => setNewLocation(e.target.value)}
                                            className="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs font-semibold"
                                        >
                                            <option value="Kuching City Centre">Kuching City Centre</option>
                                            <option value="Santubong & Damai">Santubong & Damai</option>
                                            <option value="Satok">Satok</option>
                                            <option value="Matang">Matang</option>
                                            <option value="Padungan">Padungan</option>
                                            <option value="Batu Kawa">Batu Kawa</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Nightly Price (MYR)</label>
                                        <input 
                                            type="number" 
                                            min="80" 
                                            max="1000" 
                                            value={newPrice}
                                            onChange={(e) => setNewPrice(e.target.value)}
                                            className="w-full px-4 py-2 rounded-xl border border-gray-300 text-xs font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Bedrooms</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="10" 
                                            value={newBedrooms}
                                            onChange={(e) => setNewBedrooms(e.target.value)}
                                            className="w-full px-4 py-2 rounded-xl border border-gray-300 text-xs font-bold"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Description</label>
                                    <textarea 
                                        rows="3" 
                                        placeholder="Describe your property amenities and proximity to attractions..."
                                        value={newDescription}
                                        onChange={(e) => setNewDescription(e.target.value)}
                                        className="w-full px-4 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-teal-600"
                                    ></textarea>
                                </div>

                                <button 
                                    type="submit"
                                    className="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-xl shadow-md transition"
                                >
                                    Publish Property Listing
                                </button>
                            </form>
                        </div>
                    )}

                    {/* Active Properties List */}
                    <div className="space-y-4">
                        <h3 className="font-extrabold text-gray-900 text-base">Your Active Properties ({homestays.length})</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {homestays.map(stay => (
                                <div key={stay.id} className="bg-white p-4 rounded-2xl border border-gray-200 flex items-center space-x-3">
                                    <img src={stay.image_url} className="w-16 h-16 rounded-xl object-cover" alt="" />
                                    <div className="min-w-0 flex-1">
                                        <h4 className="font-bold text-xs text-gray-900 truncate">{stay.title}</h4>
                                        <p className="text-[10px] text-gray-500">{stay.location}</p>
                                        <span className="text-xs font-extrabold text-teal-800">{formatMYR(stay.nightly_price_myr)}/night</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
